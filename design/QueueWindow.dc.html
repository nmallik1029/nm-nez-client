<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #93a892; } a:hover { color: #b3c6b2; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 460px; height: 520px; background: #0a0b0d; font-family: 'IBM Plex Sans', system-ui, sans-serif; padding: 22px; display: flex;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; background: #111318; border: 1px solid #2c313a; border-radius: 6px; overflow: hidden;">

    <!-- Header. The rule below it carries the queue state, same beat as the frame. -->
    <div style="padding: 15px 18px; text-align: center; background: #0d0f13; border-bottom: 2px solid {{stateRule}};">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #d7dbe2;">Ranked Queue</div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px;">

      <div style="text-align: center;">
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 46px; font-weight: 600; letter-spacing: .04em; line-height: 1; color: {{timerColor}};">00:04:12</div>
        <div style="font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b717c; margin-top: 10px;">{{statusLabel}}</div>
      </div>

      <div style="width: 100%; max-width: 260px; text-align: center; padding: 13px 0; border-radius: 5px; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: {{buttonText}}; background: {{buttonBg}}; border: 2px solid {{buttonBorder}};">{{buttonLabel}}</div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
        <sc-for list="{{regions}}" as="r" hint-placeholder-count="5">
          <div style="padding: 8px 17px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: .1em; color: {{r.color}}; background: {{r.bg}}; border: 1px solid {{r.border}};">{{r.name}}</div>
        </sc-for>
      </div>

    </div>

    <div style="padding: 13px 18px; border-top: 1px solid #2c313a; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 11px; color: #6b717c;">Runs with the game closed</span>
      <span style="font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: #4b5750;">v0.1.5</span>
    </div>

  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"state":{"editor":"enum","options":["queued","idle","cooldown"],"default":"queued"},"$preview":{"width":460,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'queued';

    const go = '#93a892';
    const goDim = '#4b5750';
    const stop = '#b47a72';

    if (state === 'idle') {
      return {
        stateRule: '#2c313a',
        timerColor: '#6b717c',
        statusLabel: 'Not queued',
        buttonLabel: 'Start queue',
        buttonText: go,
        buttonBg: 'transparent',
        buttonBorder: goDim,
        regions: this.regions(['NA'], '#2c313a'),
      };
    }

    if (state === 'cooldown') {
      return {
        stateRule: stop,
        timerColor: stop,
        statusLabel: 'On cooldown',
        buttonLabel: 'Start queue',
        buttonText: '#6b717c',
        buttonBg: 'transparent',
        buttonBorder: '#2c313a',
        regions: this.regions(['NA'], '#2c313a'),
      };
    }

    return {
      stateRule: go,
      timerColor: go,
      statusLabel: 'Searching',
      buttonLabel: 'Leave queue',
      buttonText: stop,
      buttonBg: 'rgb(105,16,5)',
      buttonBorder: stop,
      regions: this.regions(['NA', 'EU'], '#7d8695'),
    };
  }

  regions(on, onBorder) {
    return ['NA', 'EU', 'ASIA', 'SA', 'AU'].map((name) => {
      const picked = on.includes(name);
      return {
        name,
        color: picked ? '#d7dbe2' : '#6b717c',
        bg: picked ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.03)',
        border: picked ? onBorder : '#2c313a',
      };
    });
  }
}
</script>
</body>
</html>
