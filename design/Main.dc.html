<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #6d8cff; } a:hover { color: #8fa5ff; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 1040px; height: 720px; background: #16181d; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e8e9ec; display: flex; flex-direction: column; border: 1px solid #2f323a;">

  <!-- Toolbar: search, profile, actions -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #2f323a; background: #1b1d22;">
    <div style="display: flex; align-items: center; gap: 8px; flex-grow: 1; max-width: 300px; padding: 8px 11px; background: #16181d; border: 1px solid #2f323a; border-radius: 5px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9aa0aa" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span style="font-size: 13px; color: #9aa0aa;">Search settings</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="padding: 7px 13px; font-size: 12px; color: #c3c7ce; border: 1px solid #2f323a; border-radius: 5px; letter-spacing: .02em;">Import</div>
      <div style="padding: 7px 13px; font-size: 12px; color: #c3c7ce; border: 1px solid #2f323a; border-radius: 5px; letter-spacing: .02em;">Export</div>
      <div style="padding: 7px 13px; font-size: 12px; color: #c98b84; border: 1px solid #6d4b47; border-radius: 5px; letter-spacing: .02em;">Reset</div>
    </div>
  </div>

  <!-- Tab strip -->
  <div style="display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid #2f323a; background: #1b1d22;">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="7">
      <div style="padding: 12px 15px; font-size: 13px; font-weight: 500; letter-spacing: .02em; color: {{tab.color}}; border-bottom: 2px solid {{tab.rule}};">{{tab.name}}</div>
    </sc-for>
  </div>

  <!-- Body: section index + settings -->
  <div style="display: flex; flex-grow: 1; min-height: 0;">

    <!-- ── The section index ── -->
    <div style="width: 186px; flex-shrink: 0; border-right: 1px solid #2f323a; padding: 14px 10px; display: flex; flex-direction: column; gap: 1px; background: #191b20;">
      <div style="font-size: 10px; font-weight: 600; letter-spacing: .14em; color: #6a6f79; padding: 0 10px 9px; text-transform: uppercase;">Sections</div>
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 5px; border-left: 2px solid {{s.marker}}; background: {{s.bg}}; color: {{s.color}}; font-size: 13px; font-weight: {{s.weight}};">
          <span>{{s.name}}</span>
          <span style="font-size: 11px; color: #5c616b; font-family: 'IBM Plex Mono', monospace;">{{s.count}}</span>
        </div>
      </sc-for>
      <div style="flex-grow: 1;"></div>
      <div style="padding: 10px; border-top: 1px solid #2f323a; margin-top: 10px;">
        <div style="font-size: 11px; color: #6a6f79; line-height: 1.5;">NM/NEZ 0.1.5</div>
      </div>
    </div>

    <!-- ── Settings rows ── -->
    <div style="flex-grow: 1; min-width: 0; overflow: hidden; padding: 22px 26px; display: flex; flex-direction: column; gap: 22px;">

      <!-- Performance -->
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; align-items: baseline; gap: 10px; padding-bottom: 12px;">
          <div style="font-size: 15px; font-weight: 600; letter-spacing: .01em; color: #fff;">Performance</div>
          <div style="flex-grow: 1; height: 1px; background: #2f323a;"></div>
        </div>

        <sc-for list="{{perf}}" as="row" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 14px; padding: 11px 12px; border-radius: 5px; background: {{row.bg}};">
            <div style="flex-grow: 1; min-width: 0;">
              <div style="display: flex; align-items: center; gap: 7px;">
                <span style="font-size: 13px; color: #e8e9ec;">{{row.label}}</span>
                <sc-if value="{{row.tag}}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 9px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: {{row.tagColor}}; border: 1px solid {{row.tagBorder}}; border-radius: 3px; padding: 2px 5px;">{{row.tag}}</span>
                </sc-if>
              </div>
              <div style="font-size: 11px; color: #7d838d; margin-top: 3px; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.hint}}</div>
            </div>
            <div style="width: 34px; height: 19px; flex-shrink: 0; border-radius: 10px; background: {{row.trackBg}}; border: 1px solid {{row.trackBorder}}; position: relative;">
              <div style="position: absolute; top: 2px; left: {{row.knobX}}; width: 13px; height: 13px; border-radius: 50%; background: {{row.knob}};"></div>
            </div>
          </div>
        </sc-for>

        <!-- Slider row -->
        <div style="display: flex; align-items: center; gap: 14px; padding: 11px 12px;">
          <div style="flex-grow: 1;">
            <span style="font-size: 13px; color: #e8e9ec;">FPS cap</span>
            <div style="font-size: 11px; color: #7d838d; margin-top: 3px;">0 leaves it uncapped</div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0;">
            <div style="width: 168px; height: 3px; border-radius: 2px; background: #2f323a; position: relative;">
              <div style="position: absolute; left: 0; top: 0; height: 3px; width: 62%; border-radius: 2px; background: #6d8cff;"></div>
              <div style="position: absolute; left: 62%; top: -4px; width: 11px; height: 11px; margin-left: -5px; border-radius: 50%; background: #e8e9ec;"></div>
            </div>
            <div style="width: 52px; text-align: center; padding: 5px 0; font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: #e8e9ec; border: 1px solid #2f323a; border-radius: 4px;">240</div>
          </div>
        </div>
      </div>

      <!-- Matchmaker -->
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="display: flex; align-items: baseline; gap: 10px; padding-bottom: 12px;">
          <div style="font-size: 15px; font-weight: 600; letter-spacing: .01em; color: #fff;">Matchmaker</div>
          <div style="flex-grow: 1; height: 1px; background: #2f323a;"></div>
        </div>

        <div style="padding: 4px 12px 12px;">
          <div style="font-size: 11px; color: #7d838d; margin-bottom: 9px;">Regions</div>
          <div style="display: flex; flex-wrap: wrap; gap: 7px;">
            <sc-for list="{{regions}}" as="r" hint-placeholder-count="8">
              <div style="padding: 6px 12px; border-radius: 5px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; letter-spacing: .04em; color: {{r.color}}; background: {{r.bg}}; border: 1px solid {{r.border}};">{{r.name}}</div>
            </sc-for>
          </div>
        </div>

        <div style="padding: 4px 12px;">
          <div style="font-size: 11px; color: #7d838d; margin-bottom: 9px;">Modes</div>
          <div style="display: flex; flex-wrap: wrap; gap: 7px;">
            <sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
              <div style="padding: 6px 12px; border-radius: 5px; font-size: 12px; color: {{m.color}}; background: {{m.bg}}; border: 1px solid {{m.border}};">{{m.name}}</div>
            </sc-for>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#6d8cff","options":["#6d8cff","#7d9d7a","#c9b184","#b47a72"]},"$preview":{"width":1040,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6d8cff';
    const dim = '#9aa0aa';

    const tabs = ['General', 'Controls', 'Display', 'Render', 'Game', 'Sound', 'Client'].map((name) => ({
      name,
      color: name === 'Client' ? '#fff' : '#8d939d',
      rule: name === 'Client' ? accent : 'transparent',
    }));

    const sections = [
      { name: 'Performance', count: '8', on: true },
      { name: 'Content', count: '5' },
      { name: 'Matchmaker', count: '6' },
      { name: 'Chat', count: '2' },
      { name: 'Customisation', count: '4' },
      { name: 'Themes', count: '3' },
      { name: 'Shortcuts', count: '7' },
    ].map((s) => ({
      name: s.name,
      count: s.count,
      marker: s.on ? accent : 'transparent',
      bg: s.on ? '#1f232b' : 'transparent',
      color: s.on ? '#fff' : dim,
      weight: s.on ? '500' : '400',
    }));

    const toggle = (on) => ({
      trackBg: on ? accent : '#24272e',
      trackBorder: on ? accent : '#363a43',
      knob: on ? '#fff' : '#6a6f79',
      knobX: on ? '16px' : '2px',
    });

    const perf = [
      {
        label: 'Unlock frame rate', on: true, tag: 'Restart',
        tagColor: '#e05a5a', tagBorder: '#5c3535',
        hint: 'Render as fast as the GPU can manage instead of stopping at your refresh rate',
      },
      {
        label: 'Raw mouse input', on: true, tag: '',
        tagColor: '', tagBorder: '',
        hint: 'Take movement straight from the mouse instead of letting Windows curve it',
      },
      {
        label: 'Scroll frame-pacing fix', on: false, tag: 'Reload',
        tagColor: '#4d90e0', tagBorder: '#2f4a68',
        hint: 'Stop a scroll gesture pinning your FPS to the monitor refresh rate',
      },
    ].map((r, i) => ({ ...r, ...toggle(r.on), bg: i % 2 === 0 ? '#1a1c21' : 'transparent' }));

    const chip = (on) => ({
      color: on ? '#fff' : dim,
      bg: on ? '#26314f' : '#1b1d22',
      border: on ? accent : '#2f323a',
    });

    const regions = ['NA', 'EU', 'AS', 'SA', 'AU', 'DAL', 'FRA', 'SYD']
      .map((name, i) => ({ name, ...chip(i < 2) }));

    const modes = ['Free For All', 'Team Deathmatch', 'Hardpoint', 'Capture the Flag', 'Parkour']
      .map((name, i) => ({ name, ...chip(i === 0 || i === 2) }));

    return { tabs, sections, perf, regions, modes };
  }
}
</script>
</body>
</html>
