# Windows and Linux. No macOS target, which is what lets us skip the Apple
# Developer ID and notarisation pipeline, a good chunk of the complexity in the
# clients this is based on. Linux costs one launcher script, written by
# scripts/after-pack.mjs; see the linux section below.
#
# Both values below mirror src/shared/branding.ts and have to stay in step.
#
# appId: Windows keys taskbar pin persistence off it, so changing this after a
# release orphans anyone's existing pins.
#
# productName: this is BRANDING.fileSafeName, not BRANDING.productName. The
# display name "NM/NZ" has a slash in it, and electron-builder feeds
# productName straight into artifactName and the default NSIS install path,
# where a slash reads as a directory separator.
appId: com.nmnez.client
productName: NM-NZ

# What Windows calls the app when it asks the user about it.
#
# electron-builder writes the exe's FileDescription from the package
# description, and that is the string a browser puts in "A website wants to
# open this application": ours read "Open Performance-focused Krunker client
# for Windows?", which is a sentence about the client rather than its name.
# package.json keeps the sentence, because that is what a package description
# is for; the exe gets the name.
extraMetadata:
  description: NM/NZ Client

directories:
  output: out
  buildResources: build

# Where the updater looks. This does two things at build time: writes
# app-update.yml into the package so the client knows which repo to ask, and
# emits latest.yml next to the installer, which is the manifest it reads to
# find out what the newest version is.
#
# Only the NSIS installer and the AppImage can self-update, from latest.yml
# and latest-linux.yml respectively. A portable exe has no install directory
# to replace, so those users have to download again by hand.
publish:
  provider: github
  owner: nmallik1029
  repo: nm-nez-client
  # Publish outright rather than leaving a draft nobody remembers to press
  # the button on. A draft is invisible to the updater, so a forgotten one
  # means installed clients never hear about the version at all.
  releaseType: release

# No runtime dependencies, so this is the whole payload. The clients we cribbed
# from keep about 24 node_modules paths in here by hand to satisfy
# electron-store's transitive tree, and that list breaks quietly on any
# dependency change. Easier not to have the dependency.
files:
  - dist/**/*
  - '!**/*.map'
  # Sounds the client plays, shipped rather than downloaded. Small enough
  # that asar packing them costs nothing, and main reads them through
  # app.getAppPath() so the same path works from the repo and from inside
  # the package.
  - assets/**/*
  # Except the kill streak packs, which go beside the asar instead. See below.
  - '!assets/killstreak{,/**/*}'

asar: true

# The kill streak packs, as plain files at resources/killstreak. Not in the
# asar: the page loads their audio in byte ranges, and opening a file inside
# an asar for that means Electron first copying it out to a temp file. main
# finds them through process.resourcesPath; see bundledKillPacks in
# src/main/paths.ts.
extraResources:
  - from: assets/killstreak
    to: killstreak

# Deep links. This is what makes Windows send a "nmnez://game?action=host-comp"
# link to the client: the NSIS installer writes the registry keys for the
# scheme, so an installed build owns it from the moment it is installed.
#
# The scheme has to match BRANDING.protocolScheme, which is what the client
# parses links against, and it is awkward to change later for the same reason
# appId is: the OS keeps the registration, and any bot that has already built
# links for the old one keeps sending them.
#
# The portable exe gets no installer and so registers itself at runtime
# instead; see src/main/protocol.ts.
#
# On Linux the same block becomes MimeType=x-scheme-handler/nmnez in the
# AppImage's desktop entry, which takes effect once something integrates the
# AppImage into the menu (AppImageLauncher, Gear Lever).
protocols:
  - name: NM/NZ Client
    schemes:
      - nmnez

# Package the patched binary, not a stock one.
#
# Left alone, electron-builder resolves Electron from its own CDN cache off the
# devDependency version. That ships a stock 44.0.0 and puts the aim freeze back
# into every installer we hand out, while npm start stays fine because it uses
# node_modules directly. Pointing electronDist at the local tree means both
# paths get the same binary.
#
# scripts/fetch-electron.mjs has to have run first. It checks for the
# setFrameCap marker, so a stock tree here fails loudly instead of quietly.
# It installs the build for the machine it runs on, which is why each OS's
# package is built on that OS: --linux from Windows would package electron.exe.
electronDist: node_modules/electron/dist

# The Linux launcher. Returns straight away for any other platform.
afterPack: scripts/after-pack.mjs

win:
  # No icon key here. Left to the default, electron-builder takes
  # build/icon.ico, falls back to converting build/icon.png, and only uses the
  # stock Electron icon if neither is there. Pinning icon.ico would break the
  # png route that build/README.md offers.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: '${productName}-${version}-Setup.${ext}'

portable:
  artifactName: '${productName}-${version}-Portable.${ext}'

# Linux: one AppImage. It runs on any distro without installing anything, and
# it is the Linux package electron-updater can update in place, by swapping the
# file for the new one, which keeps it level with the NSIS install. A .deb
# would need root for every update.
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  # PNGs named by size, the layers of build/icon.ico taken out one by one. Set
  # explicitly because electron-builder's Linux fallback finds icon.ico, can't
  # convert it, and fails the build. See build/README.md.
  icon: icons
  # The window icon at runtime; see src/main/app-icon.ts. Added to the
  # top-level extraResources, not instead of them.
  extraResources:
    - from: build/icons/256x256.png
      to: icon.png
  desktop:
    # The display name. productName is the file-safe one, which has a dash
    # where the brand has a slash.
    Name: NM/NZ
    # Has to equal the WM_CLASS the window gets, or the dock files the running
    # window under a generic icon instead of this entry. Electron takes that
    # from the app name, which main sets to BRANDING.userDataDirName, while
    # electron-builder's default here is productName.
    StartupWMClass: nmnez

appImage:
  artifactName: '${productName}-${version}-x86_64.${ext}'
  # What goes between AppRun and the link in the desktop entry's Exec line.
  # Left alone it is --no-sandbox, which would switch the renderer sandbox off
  # for every launch from the menu whatever the launcher found. An empty list
  # doesn't help; electron-builder reads that as unset. `--` ends Chromium's
  # switches, so the link after it can only ever be a link: the usual guard
  # against a crafted URL passing itself off as a switch.
  executableArgs: ['--']
