name: Release

# Push a version tag and this builds the installer and publishes it, along
# with the latest.yml manifest the in-client updater reads. Without that yml
# on a published (not draft) release, installed clients have no way to
# discover the new version. The Linux AppImage and its latest-linux.yml are
# added to the same release afterwards.
#
#   1. add the entry to src/shared/changelog.ts
#   2. git commit
#   3. npm version patch
#   4. git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # electron-builder creates the release; the notes step edits it afterwards.
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # postinstall fetches the patched Electron here; electronDist points the
      # packager at that same tree, so this is what keeps the aim-freeze fix in
      # the shipped build.
      - run: npm ci

      - run: npm run verify

      # Before the build, so a tag with no matching changelog entry fails here
      # rather than after a release is already public. The script exits 1 when
      # the version is missing or its entry is empty.
      - name: Generate release notes
        shell: bash
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - run: npm run build

      # --publish always creates the release and uploads the exe plus
      # latest.yml. releaseType in electron-builder.yml decides draft vs live.
      - name: Publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same release as files the client can swap in itself, without
      # running the installer, which Windows Smart App Control refuses to
      # start. Straight after publishing, to keep the window where a client
      # can see the release but not these as short as it can be; a client
      # that lands in it uses the installer. See src/shared/lite-update.ts.
      - name: Publish the no-installer update
        shell: bash
        run: |
          node scripts/lite-release.mjs
          gh release upload "$GITHUB_REF_NAME" out/lite/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder leaves the body empty, so the changelog goes on after.
      - name: Attach release notes
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --title "NM/NZ ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-linux:
    name: Build and publish Linux
    # After the Windows job rather than beside it. That job creates the release,
    # and electron-builder here finds it and adds the AppImage and
    # latest-linux.yml; side by side, both would try to create it. No verify
    # step: the Windows job ran it on this same commit.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installs the patched Linux Electron, as the Windows job does its own.
      - run: npm ci

      - run: npm run build

      - name: Publish
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder won't add to a release published more than two
          # hours ago, and says so only as a warning. Without this a re-run of
          # this job on an older tag would pass having uploaded nothing.
          EP_GH_IGNORE_TIME: 'true'

      # Installed AppImages find new versions through latest-linux.yml. If it
      # didn't land, they never hear about this release, and nothing else
      # would say so.
      - name: Check the Linux manifest is on the release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > assets.txt
          cat assets.txt
          grep -qx 'latest-linux.yml' assets.txt
          grep -q '\.AppImage$' assets.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
